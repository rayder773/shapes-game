name = "shapes-game-api"
main = "src/index.ts"
compatibility_date = "2026-05-03"

# Phase 0 production hardening requires:
# 1. `wrangler secret put ADMIN_API_TOKEN --env production`
# 2. `wrangler kv namespace create shapes-game-rate-limit`
# 3. Add RATE_LIMIT_KV bindings below for local/prod once the namespace IDs exist.

[[d1_databases]]
binding = "DB"
database_name = "shapes-game-analytics-dev"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.production]
name = "shapes-game-api"

[env.production.vars]
APP_ENV = "production"
ANALYTICS_MAX_BATCH_SIZE = "50"

[[env.production.d1_databases]]
binding = "DB"
database_name = "shapes-game-analytics"
database_id = "9e64b84d-4139-48d1-8393-905ac9e08ade"
migrations_dir = "migrations"
